name: "Auto-labeler de PRs"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Asignar labels por archivos modificados
    runs-on: ubuntu-latest
    steps:
      # v7: relee los labels justo antes de escribir. La v5 reemplazaba la lista
      # con la que leyó al arrancar y borraba un deploy:* puesto a mano en ese lapso.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
